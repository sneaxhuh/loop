# Reproducible free hackathon setup. Supply API keys only in Render's secret prompts.
services:
  - type: web
    name: loop-qloo
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python -m loop_app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: LOOP_ADMIN_PASSWORD
        generateValue: true
      - key: LOOP_DATABASE_URL
        fromDatabase:
          name: loop-data
          property: connectionString
      - key: QLOO_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: QLOO_BASE_URL
        value: https://hackathon.api.qloo.com
      - key: QLOO_TRUSTED_BASE_URL
        value: https://hackathon.api.qloo.com
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
databases:
  - name: loop-data
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    ipAllowList: []
